name: Slope
description: Slope is a fintech company providing credit infrastructure for business lending - an embedded
  buy-now-pay-later (BNPL) and working-capital solution that lets merchants offer flexible net-terms financing
  to their business (B2B) buyers at checkout with no added risk. Its platform combines an embedded line-of-credit
  product, the SlopeScore business cash-flow score for underwriting, and a developer API (v4) for creating
  customers and orders, driving checkout via the Slope.js widget or a hosted redirect, finalizing orders
  for payout, issuing refunds/adjustments, handling repayments, and subscribing to webhook events. Slope
  is backed by GGV Capital and has announced a relationship with Amazon.
