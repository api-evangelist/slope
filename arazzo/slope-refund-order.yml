arazzo: 1.0.1
info:
  title: Refund a finalized Slope order
  version: 1.0.0
  summary: Create a refund adjustment against an order and read it back.
  x-realizes-capability-ids:
  - BC-1320.30
  x-capability-derivation:
    method: 'deterministic join: sourceDescriptions -> per-tag OpenAPI -> tag/capability edge. No classification at this step.'
    min_confidence: 0.7
    sources:
    - capability_id: BC-1320.30
      capability_name: Loan Servicing Management
      spec: slope-orders-api-openapi.yml
      confidence: 0.7
    model: Turbo EA Capabilities by Vincent Verdet — Turbo EA, https://github.com/vincentmakes/turbo-ea-capabilities, CC BY 4.0
sourceDescriptions:
- name: ordersApi
  url: ../openapi/slope-orders-api-openapi.yml
  type: openapi
workflows:
- workflowId: refundOrder
  summary: Create a refund adjustment against an order and read it back.
  inputs:
    type: object
    properties:
      orderId:
        type: string
      amount:
        type: integer
  steps:
  - stepId: createOrderAdjustment
    operationId: createOrderAdjustment
    parameters:
    - name: orderId
      in: path
      value: $inputs.orderId
    requestBody:
      contentType: application/json
      payload:
        type: refund
        amount: $inputs.amount
    outputs:
      adjustmentId: $response.body#/id
  - stepId: getOrderAdjustment
    operationId: getOrderAdjustment
    parameters:
    - name: orderId
      in: path
      value: $inputs.orderId
    - name: id
      in: path
      value: $steps.createOrderAdjustment.outputs.adjustmentId
