arazzo: 1.0.1
info:
  title: Simulate an approved order in the sandbox
  version: 1.0.0
  summary: Create a sandbox test customer, set eligibility, create an order, and approve it.
  x-realizes-capability-ids:
  - BC-1320.30
  x-capability-derivation:
    method: 'deterministic join: sourceDescriptions -> per-tag OpenAPI -> tag/capability edge. No classification at this step.'
    min_confidence: 0.7
    sources:
    - capability_id: BC-1320.30
      capability_name: Loan Servicing Management
      spec: slope-orders-api-openapi.yml
      confidence: 0.7
    model: Turbo EA Capabilities by Vincent Verdet — Turbo EA, https://github.com/vincentmakes/turbo-ea-capabilities, CC BY 4.0
sourceDescriptions:
- name: ordersApi
  url: ../openapi/slope-orders-api-openapi.yml
  type: openapi
- name: simulationApi
  url: ../openapi/slope-simulation-api-openapi.yml
  type: openapi
workflows:
- workflowId: sandboxApproveOrder
  summary: Create a sandbox test customer, set eligibility, create an order, and approve it.
  inputs:
    type: object
    properties:
      amount:
        type: integer
        default: 10000
      currency:
        type: string
        default: usd
      externalId:
        type: string
        default: test-order-1
  steps:
  - stepId: simulateCreateCustomer
    operationId: simulateCreateCustomer
    outputs:
      customerId: $response.body#/id
  - stepId: simulateUpdateCustomerEligibility
    operationId: simulateUpdateCustomerEligibility
    requestBody:
      contentType: application/json
      payload:
        customerId: $steps.simulateCreateCustomer.outputs.customerId
  - stepId: createOrder
    operationId: createOrder
    requestBody:
      contentType: application/json
      payload:
        amount: $inputs.amount
        currency: $inputs.currency
        externalId: $inputs.externalId
    outputs:
      orderId: $response.body#/id
  - stepId: simulateApproveOrder
    operationId: simulateApproveOrder
    requestBody:
      contentType: application/json
      payload:
        orderId: $steps.createOrder.outputs.orderId
